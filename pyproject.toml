[project]
name = "youtube-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for searching YouTube, fetching transcripts, and running semantic search over stored video transcripts — no official YouTube API key required."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=0.6.2",
    "chromadb>=0.5.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
